<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090c12">
  <title>ورود | Pars Space</title>
  <style>
    :root{color-scheme:dark;--bg:#080b12;--panel:rgba(12,15,22,.78);--line:rgba(239,169,77,.24);--gold:#f0ad51;--gold2:#ffdc9b;--text:#f7f3ed;--muted:#a2a5af;--danger:#ff9b8f}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Tahoma,"Segoe UI",sans-serif}
    body{min-height:100vh;min-height:100dvh;display:grid;grid-template-columns:minmax(0,1.08fr) minmax(450px,.92fr);overflow-x:hidden;direction:ltr}
    .visual{position:relative;isolation:isolate;min-height:100vh;overflow:hidden;background:#10131b}
    .visual-bg{position:absolute;z-index:-2;inset:-1.5%;width:103%;height:103%;object-fit:cover;object-position:28% 52%;filter:saturate(1.04) contrast(1.04) brightness(.94);transform:scale(1.025);animation:scene-drift 32s ease-in-out infinite alternate;will-change:transform}
    .visual:before{content:"";position:absolute;z-index:-1;inset:0;pointer-events:none;background:radial-gradient(ellipse at 36% 78%,rgba(255,154,43,.20),transparent 32%),radial-gradient(ellipse at 43% 10%,rgba(92,111,177,.13),transparent 38%);mix-blend-mode:screen;animation:ambient-glow 8s ease-in-out infinite alternate}
    .visual:after{content:"";position:absolute;z-index:0;inset:0;pointer-events:none;background:linear-gradient(0deg,rgba(5,7,12,.88) 0%,rgba(5,7,12,.10) 31%,transparent 58%),linear-gradient(90deg,rgba(7,9,15,.03) 0%,rgba(7,9,15,.03) 64%,rgba(8,11,18,.84) 100%)}
    .visual-meta{position:absolute;z-index:2;left:clamp(24px,4vw,64px);right:clamp(24px,4vw,64px);bottom:34px;direction:ltr;display:flex;justify-content:space-between;align-items:end;gap:20px;color:#e7b76f;font:11px/1.9 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.14em;text-shadow:0 2px 18px #000}
    .visual-meta .status{color:#d0d0d4;letter-spacing:.08em;text-align:right}
    .login-side{position:relative;display:flex;align-items:center;justify-content:center;padding:48px clamp(30px,5vw,86px);direction:rtl;background:radial-gradient(ellipse at 54% 18%,rgba(177,107,35,.11),transparent 39%),linear-gradient(135deg,#090c13,#0a0c12 65%,#0d0e13)}
    .login-side:before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 15%,rgba(255,255,255,.018) 48%,transparent 72%);opacity:.6}
    .login-wrap{position:relative;width:min(100%,440px);direction:rtl;animation:panel-enter .85s cubic-bezier(.2,.75,.2,1) both}
    .brand{display:flex;align-items:center;gap:14px;margin-bottom:48px}
    .mark{width:48px;height:48px;border:1px solid rgba(239,169,77,.42);border-radius:15px;display:grid;place-items:center;color:var(--gold2);font:700 16px ui-monospace,monospace;background:linear-gradient(145deg,rgba(239,169,77,.12),rgba(239,169,77,.025));box-shadow:inset 0 0 22px rgba(239,169,77,.06),0 8px 30px rgba(0,0,0,.18)}
    .brand-name{font:700 19px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.12em;direction:ltr}
    .brand-caption{font-size:11px;color:var(--muted);margin-top:6px;letter-spacing:.03em}
    .eyebrow{color:var(--gold);font-size:11px;letter-spacing:.13em;margin-bottom:13px}
    h1{font-size:29px;font-weight:600;letter-spacing:-.04em;margin:0 0 12px}
    .intro{color:var(--muted);font-size:13px;line-height:2;margin:0 0 32px}
    .field{margin-bottom:19px}
    label{display:block;font-size:12px;color:#e0dbd1;margin:0 0 10px}
    .input-wrap{position:relative}
    input{width:100%;height:56px;border:1px solid rgba(255,255,255,.10);border-radius:12px;background:linear-gradient(145deg,rgba(21,24,32,.96),rgba(14,17,24,.96));color:var(--text);padding:0 16px;font:14px Tahoma,sans-serif;outline:none;transition:border-color .22s,box-shadow .22s,background .22s,transform .22s}
    input:focus{border-color:rgba(239,169,77,.82);background:#12151d;box-shadow:0 0 0 4px rgba(239,169,77,.075),0 8px 28px rgba(0,0,0,.15)}
    input::placeholder{color:#727681}
    .password-input{padding-left:70px}
    .show-password{position:absolute;left:8px;top:8px;height:40px;padding:0 12px;border:1px solid transparent;border-radius:8px;background:transparent;color:#aeb0b8;font:11px Tahoma,sans-serif;cursor:pointer;transition:color .2s,background .2s}
    .show-password:hover{color:var(--gold2);background:rgba(239,169,77,.07)}
    .submit{position:relative;overflow:hidden;width:100%;height:55px;margin-top:11px;border:1px solid #f5c57d;border-radius:12px;background:linear-gradient(115deg,#f4c277 0%,#efad50 50%,#eaa047 100%);color:#21170b;font:700 14px Tahoma,sans-serif;cursor:pointer;transition:filter .22s,transform .22s,box-shadow .22s;display:flex;align-items:center;justify-content:center;gap:12px;box-shadow:0 8px 28px rgba(231,157,59,.12)}
    .submit:before{content:"";position:absolute;top:0;bottom:0;left:-45%;width:30%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.28),transparent);transform:skewX(-20deg);transition:left .65s ease}
    .submit:hover{filter:brightness(1.055);box-shadow:0 10px 34px rgba(231,157,59,.19);transform:translateY(-1px)}.submit:hover:before{left:120%}.submit:active{transform:translateY(1px)}.submit:disabled{opacity:.7;cursor:wait;transform:none}
    .arrow{font-size:18px;line-height:1}
    .error{display:none;margin:0 0 18px;padding:12px 14px;border:1px solid rgba(255,155,143,.32);border-radius:10px;background:rgba(255,110,96,.07);color:var(--danger);font-size:12px;line-height:1.9}
    .error.show{display:block;animation:panel-enter .25s ease both}
    .secure{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:27px;color:#9296a0;font-size:11px}
    .secure svg{color:var(--gold)}
    .foot{margin-top:42px;padding-top:19px;border-top:1px solid rgba(255,255,255,.09);color:#777b85;display:flex;justify-content:space-between;gap:12px;font:10px ui-monospace,SFMono-Regular,Consolas,monospace;direction:ltr;letter-spacing:.07em}
    @keyframes scene-drift{0%{transform:scale(1.025) translate3d(0,0,0)}100%{transform:scale(1.09) translate3d(-1.1%,.4%,0)}}
    @keyframes ambient-glow{0%{opacity:.55}100%{opacity:1}}
    @keyframes panel-enter{from{opacity:0;transform:translateY(13px)}to{opacity:1;transform:translateY(0)}}
    @media(max-width:1000px){body{grid-template-columns:minmax(0,1fr) minmax(400px,.9fr)}.login-side{padding-inline:32px}.brand{margin-bottom:37px}}
    @media(max-width:820px){body{display:block}.visual{position:fixed;inset:0;min-height:100%;opacity:.62}.visual-bg{object-position:29% 50%;}.visual:after{background:linear-gradient(0deg,rgba(7,9,14,.88),rgba(7,9,14,.52) 64%,rgba(7,9,14,.35))}.visual-meta{display:none}.login-side{z-index:2;min-height:100vh;min-height:100dvh;direction:rtl;background:transparent;padding:28px 22px}.login-wrap{max-width:440px;padding:32px 28px;border:1px solid rgba(239,169,77,.20);border-radius:20px;background:rgba(9,12,18,.78);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 28px 90px rgba(0,0,0,.42)}.brand{margin-bottom:31px}h1{font-size:25px}.foot{margin-top:30px}}
    @media(max-width:420px){.login-wrap{padding:25px 19px}.brand{margin-bottom:26px}.intro{margin-bottom:25px}input{height:53px}.submit{height:53px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
  </style>
</head>

    <div class="visual-meta"><div>PARS SPACE<br>PRIVATE ACCESS / 01</div><div class="status">SYSTEM READY<br>SECURE SESSION</div></div>
  </aside>
  <main class="login-side">
    <section class="login-wrap" aria-labelledby="page-title">
      <div class="brand"><div class="mark" aria-hidden="true">PS</div><div><div class="brand-name">PARS SPACE</div><div class="brand-caption">پنل مدیریت اتصال</div></div></div>
      <div class="eyebrow">ورود امن مدیر</div>
      <h1 id="page-title">خوش برگشتی</h1>
      <p class="intro">برای ورود به فضای مدیریت، اطلاعات حساب خود را وارد کنید.</p>
      <div class="error" id="login-error" role="alert" aria-live="polite"></div>
      <form id="login-form" autocomplete="on">
        <div class="field"><label for="username">نام کاربری</label><input id="username" name="username" type="text" placeholder="نام کاربری مدیر" autocomplete="username" autocapitalize="none" spellcheck="false" required maxlength="128"></div>
        <div class="field"><label for="password">رمز عبور</label><div class="input-wrap"><input class="password-input" id="password" name="password" type="password" placeholder="رمز عبور حساب" autocomplete="current-password" required maxlength="1024"><button class="show-password" type="button" id="toggle-password" aria-label="نمایش رمز عبور">نمایش</button></div></div>
        <button class="submit" id="login-button" type="submit"><span id="button-label">ورود به پنل</span><span class="arrow" aria-hidden="true">←</span></button>
      </form>
      <div class="secure"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M12 3 19 6v5c0 5-3 8-7 10-4-2-7-5-7-10V6l7-3Z"/><path d="m9 12 2 2 4-4"/></svg><span>اتصال امن و محافظت‌شده</span></div>
      <footer class="foot"><span>PARS SPACE · SECURE ACCESS</span><span>PRIVATE / SECURE</span></footer>
    </section>
  </main>
  <script>
    (() => {
      const form = document.getElementById('login-form');
      const username = document.getElementById('username');
      const password = document.getElementById('password');
      const button = document.getElementById('login-button');
      const label = document.getElementById('button-label');
      const error = document.getElementById('login-error');
      const toggle = document.getElementById('toggle-password');
      toggle.addEventListener('click', () => {
        const reveal = password.type === 'password';
        password.type = reveal ? 'text' : 'password';
        toggle.textContent = reveal ? 'پنهان' : 'نمایش';
        toggle.setAttribute('aria-label', reveal ? 'پنهان کردن رمز عبور' : 'نمایش رمز عبور');
        password.focus();
      });
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        if (window.location.protocol === 'file:') {
          error.textContent = 'این فایل فقط پیش‌نمایش طراحی است. برای ورود واقعی، صفحه را از آدرس سرور Pars Space باز کنید (مثلاً آدرس Railway به‌همراه /login).';
          error.classList.add('show');
          return;
        }
        error.classList.remove('show');
        error.textContent = '';
        button.disabled = true;
        label.textContent = 'در حال بررسی…';
        try {
          const response = await fetch('/api/login', {
            method: 'POST',
            credentials: 'same-origin',
            headers: {'Content-Type': 'application/json', 'Accept': 'application/json'},
            body: JSON.stringify({username: username.value.trim(), password: password.value})
          });
          let data = {};
          try { data = await response.json(); } catch (_) {}
          if (!response.ok || data.ok !== true) {
            throw new Error(data.detail || 'نام کاربری یا رمز عبور نادرست است.');
          }
          window.location.replace('/spider');
        } catch (err) {
          error.textContent = err instanceof TypeError ? 'ارتباط با سرور برقرار نشد. اتصال را بررسی و دوباره تلاش کنید.' : (err.message || 'ورود انجام نشد. دوباره تلاش کنید.');
          error.classList.add('show');
          button.disabled = false;
          label.textContent = 'ورود به پنل';
        }
      });
    })();
  </script>
</body>
